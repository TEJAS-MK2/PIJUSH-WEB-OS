<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><meta name="description" content="PIJUSH OS — a browser-based operating system interface."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./favicon.svg" type="image/svg+xml"><title>PIJUSH OS</title><link rel="stylesheet" href="./styles.css?v=7"><script>
(async()=>{
 const params=new URLSearchParams(location.search);
 if(params.has("nosw")||!("serviceWorker" in navigator))return;
 try{
  const regs=await navigator.serviceWorker.getRegistrations();
  const mine=regs.filter(r=>r.scope.startsWith(location.origin+location.pathname.replace(/[^/]*$/,""))||r.active?.scriptURL.includes("/PIJUSH-WEB-OS/sw.js")||r.waiting?.scriptURL.includes("/PIJUSH-WEB-OS/sw.js"));
  const keys=await caches.keys();
  const oldCaches=keys.filter(k=>k.startsWith("pijush-os-"));
  if(mine.length||oldCaches.length){
   await Promise.all(mine.map(r=>r.unregister()));
   await Promise.all(oldCaches.map(k=>caches.delete(k)));
   params.set("nosw","1");
   location.replace(location.pathname+"?"+params.toString()+location.hash);
  }
 }catch(e){console.warn("PIJUSH OS cache recovery skipped",e)}
})();
</script></head><body><div id="boot" class="boot"><div class="boot-mark">P</div><div class="boot-title">PIJUSH OS</div><div class="boot-status">Starting system services…</div></div><main id="desktop" class="desktop" aria-label="PIJUSH OS desktop"><div class="wallpaper"></div><header class="topbar"><button class="brand" data-action="launcher"><span class="brand-dot"></span>PIJUSH OS</button><div id="top-status" class="top-status"></div><div class="top-actions"><button data-action="notifications" class="icon-btn">◌</button><button data-action="settings" class="icon-btn">⚙</button><span id="clock"></span></div></header><section id="windows" class="windows"></section><div id="launcher" class="launcher hidden"><div class="launcher-head"><input id="app-search" placeholder="Search applications…" autocomplete="off"></div><div id="app-grid" class="app-grid"></div></div><div id="context-menu" class="context-menu hidden"></div><footer class="dock" id="dock"></footer><div id="notifications" class="notifications"></div></main><script src="./kernel.js?v=7"></script><script src="./recovery.js?v=7"></script><script src="./package-manager.js?v=7"></script><script src="./app.js?v=7"></script></body></html>
